# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# 결제 로컬 트랜잭션·토스 호출·Kafka 결과 전파의 책임과 검증 범위를 구분합니다.
language: ko-KR
tone_instructions: "실제 버그·권한·데이터 일관성을 한국어로 설명하세요. 미확정 정책을 임의로 추가하지 마세요."
reviews:
  profile: chill
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["^main$", "^develop$"]
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradle/wrapper/*.jar"
  path_instructions:
    - path: "src/main/java/**"
      instructions: |
        Payment는 자신의 결제 DB만 관리하고 Order Saga와 Product 재고 책임을 가져오지 않습니다.
        개인키·토큰 발급은 Account 책임입니다. 사용자 헤더를 인증 근거로 신뢰하지 마세요.
        토스 호출은 DB 트랜잭션 밖에서 수행하고 결과와 Outbox는 같은 로컬 트랜잭션으로 저장합니다.
        중복·순서 역전·임대 만료·타임아웃을 검토하며 대역 테스트와 실제 브라우저 결제를 구분하세요.
        한국어 주석·4칸 들여쓰기·service/impl·request/response·책임별 global/config를 유지하세요.
    - path: "src/main/resources/**"
      instructions: |
        일반 DB와 Command DB를 혼동하지 말고 개발 update·테스트 create-drop·운영 validate를 유지하세요.
        비밀값·개인정보·실제 토큰을 코드나 로그에 넣지 마세요.
chat:
  auto_reply: true
